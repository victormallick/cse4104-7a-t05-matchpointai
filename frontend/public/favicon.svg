<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="64" height="64" rx="18" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="17" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none" />

  <!-- Outer Match Ring -->
  <circle cx="32" cy="32" r="18" stroke="url(#targetGrad)" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.85" />

  <!-- Core Match Target Points -->
  <circle cx="32" cy="32" r="10" stroke="#FFFFFF" stroke-width="2" opacity="0.9" />
  
  <!-- Central Match Center Star / Sparkle -->
  <path d="M32 18L34.2 27.8L44 30L34.2 32.2L32 42L29.8 32.2L20 30L29.8 27.8Z" fill="url(#sparkleGrad)" filter="url(#glow)" />

  <!-- Top Right Accent Dot -->
  <circle cx="46" cy="18" r="3" fill="#38BDF8" />
  <!-- Bottom Left Accent Dot -->
  <circle cx="18" cy="46" r="2" fill="#C084FC" />
</svg>
